<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #4b4e8c;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="38.6"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="escritorio"
        style="z-index: 1"
        data-composition-id="escritorio"
        data-composition-src="compositions/escritorio.html"
        data-start="0"
        data-duration="38.6"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="carteles"
        style="z-index: 2"
        data-composition-id="carteles"
        data-composition-src="compositions/carteles.html"
        data-start="0"
        data-duration="38.6"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
      <audio
        id="voz"
        class="clip"
        src="assets/voz.wav"
        data-start="0"
        data-track-index="3"
        data-volume="1"
      ></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
