  <script>
    const tl = gsap.timeline({ paused: true });
    const C = "50% 50%";

    function pop(sel, t, d) {
      tl.fromTo(
        sel,
        { scale: 0, opacity: 0, transformOrigin: C },
        { scale: 1, opacity: 1, duration: d || 0.4, ease: "back.out(2.4)" },
        t,
      );
    }
    function popAgain(sel, t, d) {
      tl.to(sel, { scale: 1, opacity: 1, duration: d || 0.4, ease: "back.out(2.4)", transformOrigin: C }, t);
    }
    function out(sel, t) {
      tl.to(sel, { scale: 0, opacity: 0, duration: 0.25, ease: "power2.in", transformOrigin: C }, t);
    }
    function wall(t, wallFill, floorFill) {
      tl.to("#esc-wall", { fill: wallFill, duration: 0.6, ease: "power2.inOut" }, t);
      tl.to("#esc-floor", { fill: floorFill, duration: 0.6, ease: "power2.inOut" }, t);
    }
    // Boca: "smile" | "flat" | "open"
    function mouth(state, t) {
      tl.to("#esc-m-smile", { opacity: state === "smile" ? 1 : 0, duration: 0.1 }, t);
      tl.to("#esc-m-flat", { opacity: state === "flat" ? 1 : 0, duration: 0.1 }, t);
      tl.to("#esc-m-open", { opacity: state === "open" ? 1 : 0, duration: 0.1 }, t);
    }
    function talk(t0, t1) {
      mouth("open", t0);
      const amps = [0.45, 1, 0.7, 0.3, 0.9, 0.55, 0.8, 0.4];
      let i = 0;
      for (let t = t0; t < t1 - 0.26; t += 0.14) {
        tl.to("#esc-m-open", { scaleY: amps[i % amps.length], svgOrigin: "540 892", duration: 0.12, ease: "sine.inOut" }, t);
        i++;
      }
      tl.to("#esc-m-open", { scaleY: 1, svgOrigin: "540 892", duration: 0.1 }, t1 - 0.1);
    }
    function eyesClosed(closed, t) {
      tl.to("#esc-eyes-open", { opacity: closed ? 0 : 1, duration: 0.08 }, t);
      tl.to("#esc-eyes-closed", { opacity: closed ? 1 : 0, duration: 0.08 }, t);
    }
    function blink(t) {
      tl.to("#esc-eyes-open", { scaleY: 0.1, svgOrigin: "540 818", duration: 0.06 }, t);
      tl.to("#esc-eyes-open", { scaleY: 1, svgOrigin: "540 818", duration: 0.09 }, t + 0.08);
    }

    // Respiración de fondo
    tl.fromTo(
      "#esc-girl",
      { y: 0 },
      { y: -5, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 31 },
      0,
    );

    // ---------- GANCHO 0 – 3.6: cansada frente a la pila ----------
    tl.fromTo("#esc-head", { rotation: 4, svgOrigin: "540 930" }, { rotation: 6, svgOrigin: "540 930", duration: 1, ease: "sine.inOut" }, 0);
    tl.fromTo("#esc-lids", { scaleY: 1, svgOrigin: "540 798" }, { scaleY: 1.15, svgOrigin: "540 798", duration: 0.8 }, 0);
    tl.fromTo("#esc-q1", { opacity: 1, y: 0 }, { opacity: 1, y: -14, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 2 }, 0);
    pop("#esc-q2", 0.35);
    tl.fromTo("#esc-stack", { rotation: 0, svgOrigin: "230 1180" }, { rotation: -2.5, svgOrigin: "230 1180", duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 5 }, 0.2);
    // cabeceo de sueño y sobresalto
    tl.to("#esc-head", { y: 16, rotation: 9, svgOrigin: "540 930", duration: 0.5, ease: "power2.in" }, 1.0);
    tl.to("#esc-head", { y: -10, rotation: 0, svgOrigin: "540 930", duration: 0.22, ease: "back.out(3)" }, 1.55);
    tl.to("#esc-head", { y: 0, svgOrigin: "540 930", duration: 0.3, ease: "power2.out" }, 1.8);
    // "Probá estos tres tips": se despierta
    tl.to("#esc-lids", { scaleY: 0, svgOrigin: "540 798", duration: 0.18 }, 2.07);
    tl.fromTo("#esc-eyes", { scale: 1, svgOrigin: "540 818" }, { scale: 1.18, svgOrigin: "540 818", duration: 0.16, ease: "back.out(3)" }, 2.07);
    tl.to("#esc-eyes", { scale: 1, svgOrigin: "540 818", duration: 0.3 }, 2.4);
    tl.to("#esc-brows", { y: -8, duration: 0.2, ease: "back.out(3)" }, 2.07);
    mouth("smile", 2.15);
    out("#esc-q1", 2.2);
    out("#esc-q2", 2.3);
    tl.to("#esc-sb5", { x: -700, rotation: -30, svgOrigin: "230 1000", duration: 0.45, ease: "power3.in" }, 3.2);
    tl.to("#esc-sb4", { x: -700, rotation: -24, svgOrigin: "230 1035", duration: 0.45, ease: "power3.in" }, 3.27);
    tl.to("#esc-sb3", { x: -700, rotation: -18, svgOrigin: "230 1075", duration: 0.45, ease: "power3.in" }, 3.34);
    tl.to("#esc-sb2", { x: -700, rotation: -12, svgOrigin: "230 1115", duration: 0.45, ease: "power3.in" }, 3.41);
    tl.to("#esc-sb1", { x: -700, rotation: -6, svgOrigin: "230 1158", duration: 0.45, ease: "power3.in" }, 3.48);

    // ---------- TIP 1 3.6 – 13.1: Pomodoro ----------
    wall(3.6, "#7c6cf2", "#4a3fa8");
    tl.to("#esc-brows", { y: 0, duration: 0.3 }, 3.7);
    pop("#esc-timer", 3.9, 0.5);
    // foco: mira el libro, cejas concentradas
    tl.to("#esc-eyes", { y: 8, duration: 0.3, ease: "power2.out" }, 5.6);
    tl.to("#esc-brows", { y: 5, duration: 0.3 }, 5.6);
    mouth("flat", 5.6);
    tl.to("#esc-ring", { strokeDashoffset: 0, duration: 3.0, ease: "none" }, 5.65);
    tl.fromTo("#esc-notif", { scale: 1, transformOrigin: C }, { scale: 1.45, duration: 0.2, ease: "sine.inOut", yoyo: true, repeat: 5, transformOrigin: C }, 6.1);
    // "con el celular lejos": lo empuja fuera
    tl.to("#esc-eyes", { x: 10, y: 4, duration: 0.2 }, 7.3);
